name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish as a prerelease
        required: true
        type: string
  # Tags pushed by GITHUB_TOKEN do not trigger workflows; Auto release calls this directly.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Release tag from a reusable/manual call or a tag push.
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter mobile lint
      - run: node --test scripts/release/*.test.mjs
      - run: node scripts/release/check.mjs

      - name: Verify tag matches app version and checkout
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$APP_VERSION" ] || [ "$(git rev-list -n 1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
            echo '::error::Release tag must match the checked-out app version and commit.'
            exit 1
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "STC_UPLOAD_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Prebuild (generate android/)
        working-directory: apps/mobile
        run: pnpm prebuild --platform android

      - name: Build signed release APK
        working-directory: apps/mobile/android
        env:
          STC_UPLOAD_STORE_PASSWORD: ${{ secrets.STC_UPLOAD_STORE_PASSWORD }}
          STC_UPLOAD_KEY_ALIAS: ${{ secrets.STC_UPLOAD_KEY_ALIAS }}
          STC_UPLOAD_KEY_PASSWORD: ${{ secrets.STC_UPLOAD_KEY_PASSWORD }}
        # lintVital only re-checks what the release lint config marks fatal; it costs ~45 s per run.
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x :app:lintVitalRelease -x :app:lintVitalAnalyzeRelease

      - name: Preserve candidate APK for build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ env.TAG }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      # The signing plugin falls back to the debug keystore by design (local dev convenience),
      # so a missing/broken secret must hard-fail HERE - a debug-signed "release" never ships.
      - name: Guard - APK must be signed with this fork's release key
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          if ! [[ "$EXPECTED_CERT" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo '::error::ANDROID_SIGNING_CERT_SHA256 repository variable is missing or invalid.'
            exit 1
          fi
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | node scripts/release/verify-signature.mjs

      - name: Upload R8 mapping (deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.TAG || github.run_number }}
          path: apps/mobile/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Extract CHANGELOG section
        if: env.TAG != ''
        run: |
          V="${TAG#v}"; V="${V%%-*}"
          awk -v ver="$V" 'index($0, "## [" ver "]") == 1 { found=1; next }
                           found && /^## \[/ { exit }
                           found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "_No CHANGELOG section found._" > "$RUNNER_TEMP/notes.md"

      - name: Stage release asset
        if: env.TAG != ''
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "SillyTavernCompanion-${TAG}.apk"

      - name: Create GitHub release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: SillyTavernCompanion-${{ env.TAG }}.apk
          body_path: ${{ runner.temp }}/notes.md
          prerelease: true
          make_latest: false
